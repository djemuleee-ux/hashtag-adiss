<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HASHTAG Manager</title><style>body{margin:0;background:#090909;color:#eee;font-family:Arial}.wrap{max-width:1000px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.box{background:#141414;border:1px solid #292929;border-radius:14px;padding:16px}.gold{color:#e5b84b}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #282828;text-align:left}.login{max-width:360px;margin:80px auto}.hide{display:none}input,button{padding:11px;border-radius:9px;border:1px solid #444;background:#101010;color:white}button{cursor:pointer}.danger{color:#f55}</style></head><body><div id="login" class="login box"><h2>HASHTAG Manager</h2><p>Demo admin access</p><input id="u" placeholder="Username" value="admin"><br><br><input id="p" type="password" placeholder="Password"><br><br><button onclick="login()">Login</button><p class="danger">Change credentials before production.</p></div><div id="app" class="wrap hide"><h1>HASHTAG ADISS <span class="gold">Manager</span></h1><div class="grid"><div class="stat"><b>Bookings</b><h2 id="bc">0</h2></div><div class="stat"><b>Song Requests</b><h2 id="rc">0</h2></div><div class="stat"><b>Celebrations</b><h2 id="yc">0</h2></div><div class="stat"><b>Tickets</b><h2 id="tc">0</h2></div></div><br><div class="box"><h2>Table Bookings</h2><table><thead><tr><th>Ref</th><th>Name</th><th>Table</th><th>Date</th><th>Status</th></tr></thead><tbody id="bt"></tbody></table></div><br><div class="box"><h2>Music Requests</h2><table><thead><tr><th>Ref</th><th>DJ</th><th>Song</th><th>Status</th></tr></thead><tbody id="rt"></tbody></table></div><br><div class="box"><h2>Celebrations</h2><table><thead><tr><th>Ref</th><th>Name</th><th>Occasion</th><th>Date</th></tr></thead><tbody id="yt"></tbody></table></div></div><script>function login(){if(document.getElementById('u').value==='admin'&&document.getElementById('p').value==='hashtag22'){document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');load()}else alert('Invalid login')}async function load(){const d=await fetch('/api/data').then(r=>r.json());bc.textContent=d.bookings.length;rc.textContent=d.requests.length;yc.textContent=d.birthdays.length;tc.textContent=d.tickets.length;bt.innerHTML=d.bookings.map(x=>`<tr><td>${x.id}</td><td>${x.name}</td><td>${x.table}</td><td>${x.date} ${x.time}</td><td>${x.status}</td></tr>`).join('');rt.innerHTML=d.requests.map(x=>`<tr><td>${x.id}</td><td>${x.dj}</td><td>${x.song}</td><td>${x.status}</td></tr>`).join('');yt.innerHTML=d.birthdays.map(x=>`<tr><td>${x.id}</td><td>${x.name}</td><td>${x.occasion}</td><td>${x.date}</td></tr>`).join('')}</script></body></html>
